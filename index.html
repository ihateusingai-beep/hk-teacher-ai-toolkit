      one:'AI 程式編輯器（有 code 底）。', best:'改現有專案、進階開發', how:'開資料夾 → Chat／Composer', hk:'進階老師用。', privacy:'中', source:'外部', tags:'Cursor 程式' },
    { id:'manus', name:'Manus', url:'https://manus.im/', scene:['vibe','plan'], tier:'alt',
      one:'Agent 自動完成整理任務。', best:'自動整理教材、報告草稿', how:'交代任務 → 等產出 → 審核', hk:'輸出必人工核。', privacy:'中', source:'外部', tags:'Agent Manus' },
    { id:'qwen-vibe', name:'Qwen（私隱／中文 coding）', url:'https://chat.qwen.ai/', scene:['vibe','plan'], tier:'alt',
      one:'中文 coding 強，可配本地思路。', best:'私隱優先小工具構思', how:'要完整 HTML 單檔 → 複製自建 Pages', hk:'可配合本機模型思維。', privacy:'低', source:'外部', tags:'Qwen coding 私隱' },

    // ken picks
    { id:'tda', name:'TDA Builder', url:'https://chengky-bot.github.io/TDA-Prompt-Builder/', scene:['ken','plan'], tier:'gold',
      one:'教學提示詞構建器。', best:'寫準教學／家長語氣 prompt', how:'開工具 → 填場景 → 複製 prompt', hk:'Ken 製。', privacy:'低', source:'Ken製', tags:'TDA prompt Ken' },
    { id:'starclass', name:'StarClass Hub', url:'https://ihateusingai-beep.github.io/starclass-hub/', scene:['ken'], tier:'alt',
      one:'課堂獎勵／角色進化。', best:'課堂管理與動機', how:'開 hub → 課堂模式', hk:'Ken 製。', privacy:'低', source:'Ken製', tags:'獎勵 課堂 Ken' },
    { id:'mission', name:'Student Mission App', url:'https://ihateusingai-beep.github.io/Student-mission-app/', scene:['ken'], tier:'alt',
      one:'學生任務與獎勵系統。', best:'任務／徽章／證書', how:'開 app → 設任務', hk:'Ken 製。', privacy:'低', source:'Ken製', tags:'任務 Ken' },
    { id:'friendly', name:'友愛校園 V2', url:'https://ihateusingai-beep.github.io/friendly-classroom-v2/', scene:['ken'], tier:'alt',
      one:'友愛校園互動工具。', best:'品德／課堂氣氛', how:'開頁使用', hk:'Ken 製。', privacy:'低', source:'Ken製', tags:'友愛 Ken' },
    { id:'qr', name:'QR Code 產生器', url:'https://chengky-bot.github.io/qr-code-generator/', scene:['ken','form'], tier:'alt',
      one:'快速出 QR。', best:'派連結給家長／學生', how:'貼網址 → 下載', hk:'Ken 製。', privacy:'低', source:'Ken製', tags:'QR Ken' },
    { id:'mood', name:'課堂情緒溫度計', url:'https://v0-classroom-mood-thermometer.vercel.app/', scene:['ken'], tier:'alt',
      one:'課堂情緒氛圍互動。', best:'開場 check-in', how:'投屏 → 學生選', hk:'Ken 製（v0）。', privacy:'低', source:'Ken製', tags:'情緒 Ken' }
  ];

  // —— State ——
  let scene = 'all';
  let query = '';

  const $ = (id) => document.getElementById(id);
  const chipsEl = $('chips');
  const gridEl = $('grid');
  const emptyEl = $('empty');
  const metaEl = $('resultMeta');
  const qEl = $('q');

  function tierBadge(t) {
    if (t === 'gold') return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">金牌</span>';
    if (t === 'pro') return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">進階</span>';
    return '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700">備選</span>';
  }
  function sourceBadge(s) {
    if (s === '外部') return '';
    const map = { 'Ken製': 'bg-emerald-50 text-emerald-800', '校本': 'bg-sky-50 text-sky-800' };
    return map[s] ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${map[s]}">${s}</span>` : '';
  }
  function privacyBadge(p) {
    if (p === '低') return '<span></span>';
    const map = { '中': 'text-amber-700', '高': 'text-rose-700' };
    return `<span class="text-[11px] ${map[p] || ''}">注意私隱</span>`;
  }

  function filtered() {
    const qq = query.trim().toLowerCase();
    return TOOLS.filter(t => {
      const okScene = scene === 'all' || t.scene.includes(scene);
      if (!okScene) return false;
      if (!qq) return true;
      const blob = [t.name, t.one, t.best, t.how, t.hk, t.tags, t.source, t.tier].join(' ').toLowerCase();
      return blob.includes(qq);
    }).sort((a, b) => {
      const rank = { gold: 0, alt: 1, pro: 2 };
      return (rank[a.tier] - rank[b.tier]) || a.name.localeCompare(b.name, 'zh-Hant');
    });
  }

  function renderChips() {
    chipsEl.innerHTML = SCENES.map(s => `
      <button type="button" role="tab" data-scene="${s.id}"
        class="chip shrink-0 text-sm px-3 py-1.5 rounded-full border border-line bg-white hover:border-brand/40 ${scene === s.id ? 'chip-active' : ''}"
        aria-selected="${scene === s.id}">${s.label}</button>
    `).join('');
  }

  function card(t) {
    const gold = t.tier === 'gold' ? 'gold-ring' : '';
    return `
      <article class="fade-in rounded-2xl border border-line bg-white p-4 sm:p-5 flex flex-col gap-3 shadow-sm hover:shadow-md transition ${gold}">
        <div class="flex items-start justify-between gap-2">
          <h3 class="card-title font-extrabold text-base leading-snug">${escapeHtml(t.name)}</h3>
          <div class="flex flex-wrap gap-1 justify-end">${tierBadge(t.tier)}${sourceBadge(t.source)}</div>
        </div>
        <p class="text-sm text-slate-700 leading-relaxed">${escapeHtml(t.one)}</p>
        <dl class="text-xs space-y-1.5 text-slate-600">
          <div><dt class="inline font-semibold text-ink">最適合：</dt><dd class="inline">${escapeHtml(t.best)}</dd></div>
          <div><dt class="inline font-semibold text-ink">點用：</dt><dd class="inline">${escapeHtml(t.how)}</dd></div>
          <div><dt class="inline font-semibold text-ink">HK提示：</dt><dd class="inline">${escapeHtml(t.hk)}</dd></div>
        </dl>
        <div class="mt-auto pt-1 flex items-center justify-between gap-2">
          ${privacyBadge(t.privacy)}
          <a href="${t.url}" target="_blank" rel="noopener noreferrer"
            class="inline-flex items-center justify-center rounded-lg bg-brand text-white text-sm font-semibold px-3 py-2 hover:bg-indigo-700">開啟</a>
        </div>
      </article>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    const list = filtered();
    const sceneLabel = SCENES.find(s => s.id === scene)?.label || '';
    metaEl.textContent = query
      ? `「${query}」· ${list.length} 個工具`
      : `${sceneLabel} · ${list.length} 個工具`;
    gridEl.innerHTML = list.map(card).join('');
    emptyEl.classList.toggle('hidden', list.length > 0);
    renderChips();
  }

  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-scene]');
    if (!btn) return;
    scene = btn.getAttribute('data-scene');
    render();
  });

  qEl.addEventListener('input', () => {
    query = qEl.value;
    render();
  });

  $('btnClear').addEventListener('click', () => {
    qEl.value = '';
    query = '';
    scene = 'all';
    render();
    qEl.focus();
  });

  $('btnFont').addEventListener('click', () => {
    document.body.classList.toggle('lg-text');
  });

  render();
  </script>
</body>
</html>
